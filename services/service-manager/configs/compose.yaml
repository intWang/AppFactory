service_name: service-manager
http_port: "8080"
environment: compose
default_profile: compose
postgres_dsn: postgres://appfactory:appfactory@postgres:5432/appfactory?sslmode=disable
operation_store_mode: postgres
operation_store_path: /app/data/service-manager-operations.json
services:
  - name: account-service
    command: ""
    workdir: /app
    address: http://account-service:8081
    container_name: compose-account-service-1
  - name: upgrade-service
    command: ""
    workdir: /app
    address: http://upgrade-service:8082
    container_name: compose-upgrade-service-1
