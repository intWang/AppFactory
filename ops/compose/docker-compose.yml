services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: appfactory
      POSTGRES_USER: appfactory
      POSTGRES_PASSWORD: appfactory
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d

  redis:
    image: redis:7

  account-service:
    build:
      context: ../../services
      dockerfile: account-service/Dockerfile
    environment:
      APP_CONFIG_PATH: /app/configs/compose.yaml
    ports:
      - "18081:8081"
    depends_on:
      - postgres
      - redis

  upgrade-service:
    build:
      context: ../../services
      dockerfile: upgrade-service/Dockerfile
    environment:
      APP_CONFIG_PATH: /app/configs/compose.yaml
    ports:
      - "18082:8082"
    depends_on:
      - postgres
      - redis

  service-manager:
    build:
      context: ../../services
      dockerfile: service-manager/Dockerfile
    environment:
      APP_CONFIG_PATH: /app/configs/compose.yaml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "18080:8080"
    depends_on:
      - account-service
      - upgrade-service

volumes:
  postgres-data:
